<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>TB Config Studio</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell" id="shell">
  <header class="topbar">
    <button class="btn ghost icon" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="side">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
    <img src="/favicon.svg" width="22" height="22" alt="">
    <strong>TB Config Studio</strong>
    <span class="top-profile muted small" id="topProfile"></span>
  </header>
  <aside class="side" id="side" aria-label="Navigation">
    <div class="brand"><img src="/favicon.svg" width="30" height="30" alt=""><div><strong>TB Config Studio</strong><div class="muted small" id="ver"></div></div></div>
    <div class="profile-box" id="profileBox"></div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="side-foot muted small">Unofficial tool. Not made by or affiliated with TheModBase. Works offline, no data leaves this PC.<br>Made by DayzHUB.</div>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div class="scrim" id="scrim" hidden></div>
<div id="dialogs"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
